# Secret scanning for CI. Extends the default rules and allows only the
# documentation placeholders and fixtures below; anything else fails the build.
[extend]
useDefault = true

[allowlist]
description = "Documentation placeholders and test fixtures"
regexes = [
  '''od_live_(\.\.\.|3q2\.\.\.xYz)''',
  '''fn_live_\.\.\.''',
  '''\$\$S3_ACCESS_KEY_ID:\$\$S3_SECRET_ACCESS_KEY''',
  '''eyJhbGciOiJIUzI1NiIs\.\.\.''',
  '''dGhlIHNhbXBsZSBub25jZQ==''',
  '''6f1c9a2e-8a8e-4c4e-9f0b-2b6a1d7e4c10''',
  '''6f1c2b7e-0d4a-4f8e-9b1a-2c3d4e5f6a7b''',
  # Fake provider keys in the workspace AI key tests (internal/ai/byok_test.go, web mock tests).
  '''sk-or-v1-0123456789abcdefWXYZ''',
  '''sk-or-bad-12345678''',
  '''sk-test-(abcd1234|12345678)''',
  # A wrong mailbox password in the connection check tests (internal/email/connect_test.go).
  '''Wrong-Passw0rd''',
  # The Web Push content encoding named in a comment (internal/push/webpush_test.go).
  '''aes128gcm-encrypted''',
  # The iPhone app's demo mode (ios/Opendesk/Core/Demo): the demo account's fixed TOTP setup
  # secret, and the placeholder key in a demo help article's curl example.
  '''JBSWY3DPEHPK3PXPMZXW6YTB''',
  '''mgn_live_\.\.\.''',
]
paths = [
  '''internal/auth/passwords/breached\.txt''',
  '''(^|/)pnpm-lock\.yaml$''',
  # The iPhone app's demo world: sample data on the device, never a credential (DemoMode).
  '''^ios/Opendesk/Core/Demo/''',
]
