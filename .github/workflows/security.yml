name: Security

# Vulnerabilities are published against code that has not changed, so the
# dependency and image scans also run on a schedule, not only on PRs.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  ELIXIR_VERSION: "1.20.4"
  OTP_VERSION: "29.1.1"
  NODE_VERSION: "24"
  PNPM_VERSION: "12.10.1"

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: mkdir -p internal/webui/dist && echo '<!doctype html>' > internal/webui/dist/index.html
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod
          go-package: ./...

  pnpm-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [web, admin, site, docs, deploy/cloudflare/email-worker, deploy/cloudflare/help-worker]
        prod: [--prod]
        # Electron is a devDependency of the desktop app but ships inside it, so the
        # desktop audit covers every dependency.
        include:
          - dir: desktop
            prod: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - working-directory: ${{ matrix.dir }}
        env:
          PROD: ${{ matrix.prod }}
        run: pnpm audit ${PROD:+"$PROD"} --audit-level high

  # RFC 9116: a security.txt past its Expires date must be ignored by readers.
  security-txt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: security.txt expires in more than 30 days
        run: |
          exp=$(sed -n 's/^Expires: //p' site/public/.well-known/security.txt)
          if [ "$(date -d "$exp" +%s)" -le "$(date -d '+30 days' +%s)" ]; then
            echo "::error::Move Expires in site/public/.well-known/security.txt a year ahead"
            exit 1
          fi

  mix-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: realtime
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - run: mix deps.get
      - run: mix deps.audit
      - run: mix sobelow --config

  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: [opendesk, realtime]
    steps:
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/useopendesk/${{ matrix.image }}:latest
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy.sarif
          category: scheduled-${{ matrix.image }}
      # The report above lists everything; a fixable critical finding fails the run.
      - name: Fail on fixable critical findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/useopendesk/${{ matrix.image }}:latest
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
