name: Deploy

# A release tag (v1.2.3, not a pre-release like v1.2.3-rc.1) -> production:
#   1. plan Terraform (deploy/terraform/environments/production) and apply it, so
#      new settings, env vars and secrets exist before the code that needs them.
#      A plan that deletes, replaces or forgets anything but a task definition
#      waits for a reviewer (environment infrastructure-approval); any other plan
#      applies on its own (environment infrastructure). Logs and summaries carry
#      addresses and actions only (scripts/tfplan.sh).
#   2. build linux/arm64 images, push to ECR tagged with the commit SHA
#   3. run the migrations as a one-off ECS task (opendesk-migrate, direct URL)
#   4. roll api, worker and gateway onto the new images
#   5. build and deploy the four Cloudflare Pages projects (app, admin panel, site,
#      docs), the email worker and the help center worker
#
# A push to main deploys only the marketing site and the docs (target content):
# Terraform, the API, the app and the admin panel move together, on a release.
# Started by hand, every target but site and content needs a release tag. The
# images carry the tag as their version.
#
# AWS access is OIDC only (deploy/terraform, module github-oidc): the deploy role
# trusts this repository's production environment and can do nothing else; the
# Terraform roles trust the infrastructure environments (deploy/terraform/README.md,
# "Applying changes").
#
# Repository configuration (Settings > Environments > production):
#   vars:    AWS_REGION, AWS_DEPLOY_ROLE_ARN, ECS_MIGRATE_NETWORK,
#            CLOUDFLARE_ACCOUNT_ID, WEB_POSTHOG_KEY, WEB_POSTHOG_HOST, TURNSTILE_SITE_KEY,
#            APPLE_APP_IDS (TEAMID.bundle ids for app.opendesk.sh's
#            apple-app-site-association; unset writes none),
#            MAILBOX_OAUTH (mailbox sign-in the wizard offers: "google",
#            "microsoft", "google,microsoft" or "none"; unset means "microsoft")
#   secrets: CLOUDFLARE_API_TOKEN
#   deployment branches and tags: main, and tags v*
# and in each of infrastructure-plan, infrastructure and infrastructure-approval:
#   vars:    AWS_REGION, TF_STATE_BUCKET, AWS_TERRAFORM_ROLE_ARN
#   secrets: CLOUDFLARE_API_TOKEN, PLANETSCALE_SERVICE_TOKEN_ID, PLANETSCALE_SERVICE_TOKEN
#   deployment branches and tags: main, and tags v*
#
# Deploys run only when the repository variable DEPLOY_ENABLED is "true", so
# forks and a fresh clone of the repository never try to deploy.
on:
  push:
    branches: [main]
    tags: ["v*", "!v*-*"]
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy (run it from a release tag to ship that release)
        type: choice
        options: [all, backend, infrastructure, pages, site, content]
        default: all

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  CLUSTER: opendesk-production
  NODE_VERSION: "24"
  PNPM_VERSION: "12.10.1"
  # Keep in step with ci.yml.
  TERRAFORM_VERSION: "1.16.5"

jobs:
  # What this run deploys: the input when started by hand, everything for a
  # release tag, the site and the docs for a push to main.
  scope:
    name: Scope
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.t.outputs.target }}
      version: ${{ steps.t.outputs.version }}
    steps:
      # A release ships only code that reached main (through the merge queue).
      - if: github.ref_type == 'tag'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - if: github.ref_type == 'tag'
        env:
          SHA: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor "$SHA" origin/main ||
            { echo "::error::$TAG is not on main; only commits on main deploy"; exit 1; }
      - id: t
        env:
          INPUT: ${{ inputs.target }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ -n "$INPUT" ]; then target=$INPUT
          elif [ "$REF_TYPE" = tag ]; then target=all
          else target=content
          fi
          # The API, the app, the admin panel and the infrastructure ship only as a release.
          case "$target" in
            all | backend | infrastructure | pages)
              [ "$REF_TYPE" = tag ] || { echo "::error::target $target ships a release: run it from a v* tag"; exit 1; } ;;
          esac
          if [ "$REF_TYPE" = tag ]; then version=$REF_NAME; else version=$SHA; fi
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Deploying $target at $version" >> "$GITHUB_STEP_SUMMARY"

  # Terraform runs for all, backend and infrastructure. The plan role reads only,
  # so this plan takes no lock; the apply jobs plan again, with the lock, and
  # apply only that plan when it matches this one.
  infrastructure-plan:
    name: Plan infrastructure
    needs: scope
    if: contains(fromJSON('["all", "backend", "infrastructure"]'), needs.scope.outputs.target)
    runs-on: ubuntu-latest
    environment: infrastructure-plan
    permissions:
      contents: read
      id-token: write
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
      risky: ${{ steps.plan.outputs.risky }}
      digest: ${{ steps.plan.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        uses: ./.github/actions/terraform
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PLANETSCALE_SERVICE_TOKEN_ID: ${{ secrets.PLANETSCALE_SERVICE_TOKEN_ID }}
          PLANETSCALE_SERVICE_TOKEN: ${{ secrets.PLANETSCALE_SERVICE_TOKEN }}
        with:
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          state-bucket: ${{ vars.TF_STATE_BUCKET }}

  infrastructure:
    name: Apply infrastructure
    needs: infrastructure-plan
    if: needs.infrastructure-plan.outputs.changes == 'true' && needs.infrastructure-plan.outputs.risky == 'false'
    runs-on: ubuntu-latest
    environment: infrastructure
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/terraform
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PLANETSCALE_SERVICE_TOKEN_ID: ${{ secrets.PLANETSCALE_SERVICE_TOKEN_ID }}
          PLANETSCALE_SERVICE_TOKEN: ${{ secrets.PLANETSCALE_SERVICE_TOKEN }}
        with:
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          state-bucket: ${{ vars.TF_STATE_BUCKET }}
          lock: "true"
          apply: "true"
          expected-class: safe
          expected-digest: ${{ needs.infrastructure-plan.outputs.digest }}

  # The same apply, for a plan that deletes, replaces or forgets something other
  # than a task definition: it starts once a reviewer approves the deployment.
  infrastructure-approval:
    name: Apply infrastructure (approved)
    needs: infrastructure-plan
    if: needs.infrastructure-plan.outputs.changes == 'true' && needs.infrastructure-plan.outputs.risky == 'true'
    runs-on: ubuntu-latest
    environment: infrastructure-approval
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/terraform
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PLANETSCALE_SERVICE_TOKEN_ID: ${{ secrets.PLANETSCALE_SERVICE_TOKEN_ID }}
          PLANETSCALE_SERVICE_TOKEN: ${{ secrets.PLANETSCALE_SERVICE_TOKEN }}
        with:
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          state-bucket: ${{ vars.TF_STATE_BUCKET }}
          lock: "true"
          apply: "true"
          expected-class: risky
          expected-digest: ${{ needs.infrastructure-plan.outputs.digest }}

  images:
    name: Build and push images
    needs: scope
    if: contains(fromJSON('["all", "backend"]'), needs.scope.outputs.target)
    # Fargate runs ARM64 (Graviton); a native runner builds Erlang without QEMU.
    runs-on: ubuntu-24.04-arm
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      opendesk: ${{ steps.refs.outputs.opendesk }}
      realtime: ${{ steps.refs.outputs.realtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - id: refs
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          VERSION: ${{ needs.scope.outputs.version }}
        run: |
          echo "opendesk=$REGISTRY/opendesk/opendesk:$VERSION" >> "$GITHUB_OUTPUT"
          echo "realtime=$REGISTRY/opendesk/realtime:$VERSION" >> "$GITHUB_OUTPUT"
          # Tags are immutable; a re-run of the same release (or commit) reuses its images.
          for repo in opendesk realtime; do
            if aws ecr describe-images --repository-name "opendesk/$repo" --image-ids imageTag="$VERSION" >/dev/null 2>&1; then
              echo "have_$repo=true" >> "$GITHUB_OUTPUT"
            fi
          done
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: opendesk
        if: steps.refs.outputs.have_opendesk != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/opendesk.Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.refs.outputs.opendesk }}
          build-args: |
            VERSION=${{ needs.scope.outputs.version }}
            COMMIT=${{ github.sha }}
          provenance: false
          cache-from: type=gha,scope=deploy-opendesk
          cache-to: type=gha,mode=max,scope=deploy-opendesk
      - name: realtime
        if: steps.refs.outputs.have_realtime != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/realtime.Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.refs.outputs.realtime }}
          build-args: |
            VERSION=${{ needs.scope.outputs.version }}
            COMMIT=${{ github.sha }}
          provenance: false
          cache-from: type=gha,scope=deploy-realtime
          cache-to: type=gha,mode=max,scope=deploy-realtime
      # Nothing rolls out with a fixable high or critical finding: migrate and the
      # services wait on this job. ECR's login above lets Trivy pull the images.
      - name: Trivy (opendesk)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ steps.refs.outputs.opendesk }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: Trivy (realtime)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ steps.refs.outputs.realtime }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
          skip-setup-trivy: true

  # Migrations run once, before any service moves, on the direct (unpooled)
  # connection as the migrate role. The services boot with AUTO_MIGRATE=false. Migrations
  # must stay compatible with the code that is still running until step 4.
  # They wait for the infrastructure: applied, or nothing to apply (skipped).
  migrate:
    name: Migrate
    needs: [images, infrastructure-plan, infrastructure, infrastructure-approval]
    if: always() && !cancelled() && !failure() && needs.images.result == 'success' && needs.infrastructure-plan.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: net
        env:
          NETWORK: ${{ vars.ECS_MIGRATE_NETWORK }}
        run: |
          echo "subnets=$(jq -r '.awsvpcConfiguration.subnets | join(",")' <<< "$NETWORK")" >> "$GITHUB_OUTPUT"
          echo "groups=$(jq -r '.awsvpcConfiguration.securityGroups | join(",")' <<< "$NETWORK")" >> "$GITHUB_OUTPUT"
      - id: render
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1.9.1
        with:
          task-definition-family: opendesk-migrate
          container-name: migrate
          image: ${{ needs.images.outputs.opendesk }}
      - id: run
        uses: aws-actions/amazon-ecs-deploy-task-definition@a00d4d57ac0de1a99b39fe469f3d898d38717c2b # v2.6.4
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.CLUSTER }}
          run-task: true
          run-task-launch-type: FARGATE
          run-task-subnets: ${{ steps.net.outputs.subnets }}
          run-task-security-groups: ${{ steps.net.outputs.groups }}
          # Public subnets and no NAT Gateway: the task needs a public IP to
          # reach ECR; Postgres is over the PrivateLink endpoint. Its security
          # group admits nothing inbound.
          run-task-assign-public-IP: ENABLED
          run-task-started-by: github-${{ github.run_id }}
          wait-for-task-stopped: true
      - name: Migration log
        if: always() && steps.run.outputs.run-task-arn != ''
        env:
          TASK_ARN: ${{ steps.run.outputs.run-task-arn }}
        run: |
          task_id=${TASK_ARN##*/}
          aws logs get-log-events --log-group-name /ecs/opendesk-migrate \
            --log-stream-name "migrate/migrate/$task_id" --limit 200 \
            --query 'events[].message' --output text || echo "log stream not available yet"

  services:
    name: Roll ${{ matrix.service }}
    needs: [images, migrate]
    if: always() && !cancelled() && !failure() && needs.migrate.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            image: opendesk
          - service: worker
            image: opendesk
          - service: gateway
            image: realtime
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      # A new revision built from the latest one with only the image changed,
      # so environment and secrets stay whatever Terraform last registered.
      - id: render
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1.9.1
        with:
          task-definition-family: opendesk-${{ matrix.service }}
          container-name: ${{ matrix.service }}
          image: ${{ matrix.image == 'opendesk' && needs.images.outputs.opendesk || needs.images.outputs.realtime }}
      - uses: aws-actions/amazon-ecs-deploy-task-definition@a00d4d57ac0de1a99b39fe469f3d898d38717c2b # v2.6.4
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.CLUSTER }}
          service: opendesk-${{ matrix.service }}
          wait-for-service-stability: true
          wait-for-minutes: 15

  pages:
    name: Pages ${{ matrix.project }}
    needs: scope
    if: contains(fromJSON('["all", "pages", "site", "content"]'), needs.scope.outputs.target)
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project: [app, admin, site, docs]
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # site: the site alone; content: the site and the docs; all and pages: all four.
      - name: Skip what was not asked for
        id: want
        env:
          PROJECT: ${{ matrix.project }}
          TARGET: ${{ needs.scope.outputs.target }}
        run: |
          case "$TARGET:$PROJECT" in
            site:site | content:site | content:docs | all:* | pages:*) echo "run=true" ;;
            *) echo "run=false" ;;
          esac >> "$GITHUB_OUTPUT"
      - if: steps.want.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.want.outputs.run == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - if: steps.want.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # wrangler comes from the email worker's lockfile, so the version that
      # deploys production is pinned and reviewed like any other dependency.
      - name: wrangler
        if: steps.want.outputs.run == 'true'
        working-directory: deploy/cloudflare/email-worker
        run: pnpm install --frozen-lockfile && echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Build app
        if: steps.want.outputs.run == 'true' && matrix.project == 'app'
        working-directory: web
        env:
          APP_API_URL: https://api.opendesk.sh
          APP_GATEWAY_URL: wss://gateway.opendesk.sh/socket
          WEB_POSTHOG_KEY: ${{ vars.WEB_POSTHOG_KEY }}
          WEB_POSTHOG_HOST: ${{ vars.WEB_POSTHOG_HOST }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          APPLE_APP_IDS: ${{ vars.APPLE_APP_IDS }}
          MAILBOX_OAUTH: ${{ vars.MAILBOX_OAUTH || 'microsoft' }}
          # Help centers at https://<slug>.<HELP_DOMAIN> (contracts/native.md "helpDomain").
          # The repository variable is set once the help zone and its worker serve
          # (deploy/README.md); until then help centers stay on the API's /help/<slug>.
          HELP_DOMAIN: ${{ vars.HELP_DOMAIN }}
          # Matches the API's MAILBOX_IMAP (Terraform var.mailbox_imap): Cloud receives by forwarding.
          MAILBOX_IMAP: ${{ vars.MAILBOX_IMAP || 'false' }}
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          test -s dist/widget/v1.js
          # The app's own _headers win if web/ ever ships one.
          [ -f dist/_headers ] || cp ../deploy/cloudflare/pages/app/_headers dist/
          [ -f dist/_redirects ] || cp ../deploy/cloudflare/pages/app/_redirects dist/
          # Missing /assets/* files answer 404, uncached (the worker runs on /assets/* only).
          cp ../deploy/cloudflare/pages/app/_worker.js ../deploy/cloudflare/pages/app/_routes.json dist/
          # Old /help/<slug>/... app links move to the help center's own host for good.
          if [ -n "$HELP_DOMAIN" ]; then
            printf '/help/:slug https://:slug.%s/ 301\n/help/:slug/* https://:slug.%s/:splat 301\n' "$HELP_DOMAIN" "$HELP_DOMAIN" >> dist/_redirects
          fi
          node ../deploy/cloudflare/pages/app/write-config.mjs dist
          # The site's security.txt (RFC 9116) on every opendesk.sh host.
          mkdir -p dist/.well-known && cp ../site/public/.well-known/security.txt dist/.well-known/
          echo "DIST=web/dist" >> "$GITHUB_ENV"

      # The instance admin panel (contracts/admin.md) on its own origin.
      - name: Build admin
        if: steps.want.outputs.run == 'true' && matrix.project == 'admin'
        working-directory: admin
        env:
          ADMIN_API_URL: https://api.opendesk.sh
          ADMIN_APP_URL: https://app.opendesk.sh
          ADMIN_ENV_LABEL: Production
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: |
          pnpm install --frozen-lockfile
          pnpm build:pages
          test -s dist/index.html && test -s dist/config.js
          mkdir -p dist/.well-known && cp ../site/public/.well-known/security.txt dist/.well-known/
          echo "DIST=admin/dist" >> "$GITHUB_ENV"

      # opendesk.sh/install.sh is the installer of the newest release, so its
      # published checksum and the release's always agree. The site's prebuild
      # publishes main's copy; it is replaced in dist/ once a release exists.
      # The site ships its own _headers (CSP filled in by its postbuild).
      - name: Build site
        if: steps.want.outputs.run == 'true' && matrix.project == 'site'
        env:
          GH_TOKEN: ${{ github.token }}
          # The site's analytics; its postbuild adds PostHog to the CSP only when set.
          PUBLIC_POSTHOG_KEY: ${{ vars.WEB_POSTHOG_KEY }}
          PUBLIC_POSTHOG_HOST: ${{ vars.WEB_POSTHOG_HOST }}
        run: |
          cd site
          pnpm install --frozen-lockfile
          pnpm build
          if gh release download --repo "$GITHUB_REPOSITORY" --pattern 'install.sh' --pattern 'install.sh.sha256' --dir "$RUNNER_TEMP/installer" 2>/dev/null; then
            cp "$RUNNER_TEMP/installer/install.sh" "$RUNNER_TEMP/installer/install.sh.sha256" dist/
            echo "installer from the newest release"
          else
            echo "no release yet; installer from main"
          fi
          (cd dist && sha256sum -c install.sh.sha256)
          echo "DIST=site/dist" >> "$GITHUB_ENV"

      - name: Build docs
        if: steps.want.outputs.run == 'true' && matrix.project == 'docs'
        working-directory: docs
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          # The docs ship their own _headers (CSP hashes filled in by its postbuild).
          grep -q "Content-Security-Policy" dist/_headers
          mkdir -p dist/.well-known && cp ../site/public/.well-known/security.txt dist/.well-known/
          echo "DIST=docs/dist" >> "$GITHUB_ENV"

      - name: Deploy to Cloudflare Pages
        if: steps.want.outputs.run == 'true'
        env:
          PROJECT: opendesk-${{ matrix.project }}
          SHA: ${{ github.sha }}
        run: wrangler pages deploy "$DIST" --project-name "$PROJECT" --branch main --commit-hash "$SHA" --commit-dirty=true

  email-worker:
    name: Email worker
    needs: scope
    if: needs.scope.outputs.target == 'all'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    defaults:
      run:
        working-directory: deploy/cloudflare/email-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # INBOUND_SECRET is set once with `wrangler secret put` (deploy/README.md);
      # a deploy keeps it.
      - run: pnpm exec wrangler deploy

  help-worker:
    name: Help worker
    needs: scope
    if: vars.HELP_DOMAIN != '' && needs.scope.outputs.target == 'all'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    defaults:
      run:
        working-directory: deploy/cloudflare/help-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # HELP_PROXY_SECRET is set once with `wrangler secret put` (deploy/README.md);
      # a deploy keeps it. The routes in wrangler.toml are applied by this deploy.
      - run: pnpm exec wrangler deploy
