name: iOS

# Simulator builds for CI, and the TestFlight upload. A `v*` tag uploads its iOS build
# beside the release (release.yml), which never waits for it: an Apple outage or a
# signing problem holds back the iPhone build only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to sign and validate, or empty for a simulator build"
        type: string
      upload:
        description: "Upload to TestFlight (only from the matching version tag)"
        type: boolean
        default: false
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Simulator build (${{ matrix.configuration }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        env:
          CONFIGURATION: ${{ matrix.configuration }}
        run: >-
          xcodebuild -project ios/Opendesk.xcodeproj -scheme Opendesk
          -configuration "$CONFIGURATION" -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/ios-simulator"
          CODE_SIGNING_ALLOWED=NO -quiet build

  testflight:
    name: Signed build and TestFlight upload
    needs: check
    # CI calls this workflow on pushes to main too: only a version tag's own push uploads.
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.version != ''
    runs-on: macos-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
      UPLOAD: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.upload }}
      IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Archive, validate, and upload
        shell: bash
        run: |
          set -euo pipefail
          version=${VERSION#v}
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::An iOS release needs a semantic version"; exit 1
          fi
          if [ "$UPLOAD" = true ] && [ "$GITHUB_REF" != "refs/tags/v$version" ]; then
            echo "::error::TestFlight uploads run only from the matching version tag"; exit 1
          fi
          if [ -z "$IOS_TEAM_ID" ] || [ -z "$APPLE_API_KEY" ] || [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER" ]; then
            echo "::error::iOS signing needs IOS_TEAM_ID and the App Store Connect API key secrets"; exit 1
          fi
          key_dir="$HOME/.appstoreconnect/private_keys"
          key="$key_dir/AuthKey_$APPLE_API_KEY_ID.p8"
          keychain="$RUNNER_TEMP/opendesk-ios.keychain-db"
          keychain_password=$(openssl rand -base64 32)
          cleanup() {
            rm -f "$key"
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          mkdir -p "$key_dir"
          (umask 077 && printf '%s' "$APPLE_API_KEY" | base64 --decode > "$key")
          unset APPLE_API_KEY
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          security default-keychain -d user -s "$keychain"
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$key"
                -authenticationKeyID "$APPLE_API_KEY_ID" -authenticationKeyIssuerID "$APPLE_API_ISSUER")
          archive="$RUNNER_TEMP/Opendesk.xcarchive"
          xcodebuild -project ios/Opendesk.xcodeproj -scheme Opendesk \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$archive" -derivedDataPath "$RUNNER_TEMP/ios-release" \
            "${auth[@]}" DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            MARKETING_VERSION="${version%%-*}" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" \
            -quiet archive
          options="$RUNNER_TEMP/ExportOptions.plist"
          cp ios/release/ExportOptions.plist "$options"
          /usr/libexec/PlistBuddy -c 'Set :destination export' "$options"
          /usr/libexec/PlistBuddy -c "Add :teamID string $IOS_TEAM_ID" "$options"
          xcodebuild -exportArchive -archivePath "$archive" \
            -exportOptionsPlist "$options" -exportPath "$RUNNER_TEMP/ios-export" \
            "${auth[@]}" -quiet
          shopt -s nullglob
          ipas=("$RUNNER_TEMP/ios-export/"*.ipa)
          [ ${#ipas[@]} -eq 1 ] || { echo "::error::Expected one exported iOS app"; exit 1; }
          ditto -x -k "${ipas[0]}" "$RUNNER_TEMP/ios-unpacked"
          apps=("$RUNNER_TEMP/ios-unpacked/Payload/"*.app)
          [ ${#apps[@]} -eq 1 ] || { echo "::error::Expected one signed iOS app"; exit 1; }
          codesign --verify --deep --strict "${apps[0]}"
          codesign -d --entitlements :- "${apps[0]}" > "$RUNNER_TEMP/ios-entitlements.plist"
          for entitlement in aps-environment com.apple.developer.devicecheck.appattest-environment; do
            [ "$(/usr/libexec/PlistBuddy -c "Print :$entitlement" "$RUNNER_TEMP/ios-entitlements.plist")" = production ] || {
              echo "::error::The distributed app needs production $entitlement"; exit 1;
            }
          done
          xcrun altool --validate-app --type ios --file "${ipas[0]}" \
            --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER"
          if [ "$UPLOAD" = true ]; then
            xcrun altool --upload-app --type ios --file "${ipas[0]}" \
              --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-build
          path: |
            ${{ runner.temp }}/ios-export/*.ipa
            ${{ runner.temp }}/Opendesk.xcarchive/dSYMs
          if-no-files-found: error
          retention-days: 14
